name: Teste API Mercado Livre
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar
        env:
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET: ${{ secrets.ML_SECRET }}
        run: node scripts/ml-teste.mjs
      - name: Guardar token
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "techaprovado-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ml-token.enc && git commit -m "Mercado Livre: token criptografado atualizado" && git pull --rebase origin main && git push
          fi
