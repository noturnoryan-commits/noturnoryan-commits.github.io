# TechAprovado — atualiza os dados da Amazon das fichas de produto pela Creators API (oficial).
# DESLIGADO até existirem os segredos AMAZON_CREATORS_CLIENT_ID e AMAZON_CREATORS_CLIENT_SECRET.
# Hoje só roda na mão: GitHub → Actions → "Dados da Amazon (Creators API)" → Run workflow.
# Para rodar todo dia depois de aprovado, tire o "#" das duas linhas do schedule abaixo.
name: Dados da Amazon (Creators API)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 9 * * *'   # todo dia às 6h17 (Brasília)

permissions:
  contents: write

concurrency:
  group: amazon-creators
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar a Amazon
        env:
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE }}
          AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG }}
        run: node scripts/amazon-creators.mjs
      - name: Salvar no repositório
        run: |
          if [ -n "$(git status --porcelain data/amazon/ 2>/dev/null)" ]; then
            git config user.name "techaprovado-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/amazon/itens.json
            git commit -m "Dados da Amazon (Creators API)"
            git push
          fi
